name: Päivitä HSL-data ja julkaise

on:
  schedule:
    - cron: "17 3 * * 1" # maanantaisin klo 03:17 UTC
  workflow_dispatch: # käsin: Actions-välilehti -> Run workflow
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Hae uusin data (ei tavallisissa pusheissa)
        if: github.event_name != 'push'
        run: |
          pip install numpy
          python -I tools/update.py "$GITHUB_WORKSPACE"

      - name: Tallenna muuttunut data repoon
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Data ei muuttunut."
          else
            git commit -m "Päivitä HSL-data $(date -u +%F)"
            git push
          fi

      - name: Kokoa sivu
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
